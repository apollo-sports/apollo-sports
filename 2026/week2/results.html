<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>2026 Week 2 — Results</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #1a1a1a; --muted: #6b7280; --border: #e5e7eb;
    --stripe: #f9fafb; --accent: #2563eb; --accent-bg: #eff6ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111827; --fg: #e5e7eb; --muted: #9ca3af; --border: #374151;
      --stripe: #1a2333; --accent: #60a5fa; --accent-bg: #1e293b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--fg);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .caption { color: var(--muted); margin: 0 0 16px; font-size: 13px; }
  a { color: var(--accent); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  input#search, select#conference-filter {
    padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg);
    font-size: 14px;
  }
  input#search { width: 100%; max-width: 320px; }
  select#conference-filter { max-width: 220px; }
  .table-wrap {
    overflow-x: auto; border: 1px solid var(--border); border-radius: 8px;
    scrollbar-width: auto; scrollbar-color: var(--muted) var(--stripe);
  }
  /* Issue #121: a wide table (e.g. key-players.html's 28 columns) is only scrollable by trackpad
     gesture or Shift+wheel by default -- a mouse-only user (no trackpad, e.g. on Linux) has no way to
     reach the hidden/overlay scrollbar most browsers use. Explicit ::-webkit-scrollbar styling opts
     Chromium/WebKit out of overlay scrollbars entirely, so a real, always-visible, click-and-drag
     scrollbar renders instead; scrollbar-width/-color above does the same for Firefox. */
  .table-wrap::-webkit-scrollbar { height: 12px; }
  .table-wrap::-webkit-scrollbar-track { background: var(--stripe); }
  .table-wrap::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 6px; }
  .table-wrap::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  table { border-collapse: collapse; width: 100%; min-width: 640px; }
  th, td { padding: 8px 12px; text-align: left; white-space: nowrap; }
  td { border-top: 1px solid var(--border); }
  tbody tr:nth-child(even) { background: var(--stripe); }
  tbody tr[hidden] { display: none; }
  th {
    position: sticky; top: 0; background: var(--accent-bg); color: var(--accent);
    cursor: pointer; user-select: none; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em;
  }
  th:hover { text-decoration: underline; }
  th.num { text-align: right; }
  th::after { content: ""; margin-left: 4px; opacity: 0.5; }
  th[data-sort-dir="asc"]::after { content: "▲"; opacity: 1; }
  th[data-sort-dir="desc"]::after { content: "▼"; opacity: 1; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .empty, .placeholder { padding: 16px; color: var(--muted); text-align: center; }
  .placeholder { border: 1px dashed var(--border); border-radius: 8px; font-size: 14px; }
  .page-footer { margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
  .page-nav { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 16px; font-size: 13px; }
  .page-nav a { text-decoration: none; }
  .page-nav a:hover { text-decoration: underline; }
  .chip-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px;
  }
  .chip {
    display: block; border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px;
    color: inherit; text-decoration: none; background: var(--stripe);
  }
  .chip:hover { border-color: var(--accent); }
  .chip-status { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .chip-team { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .chip-team + .chip-team { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 8px; }
  .chip-logo { width: 24px; height: 24px; object-fit: contain; flex: none; }
  .chip-name { flex: 1; font-size: 14px; }
  .chip-rank { color: var(--muted); font-size: 12px; margin-right: 2px; }
  .chip-record { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .chip-score { font-variant-numeric: tabular-nums; font-weight: 600; margin-left: 8px; }
  .matchup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 20px; }
  .team-card { border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; background: var(--stripe); }
  .team-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .team-card-logo { width: 32px; height: 32px; object-fit: contain; flex: none; }
  .team-card-name { font-size: 16px; font-weight: 700; }
  .team-card-record { color: var(--muted); font-size: 13px; margin-left: auto; white-space: nowrap; }
  .stat-row { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 13px; }
  .stat-row + .stat-row { border-top: 1px solid var(--border); }
  .stat-label { color: var(--muted); }
  .stat-value { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
  .section-title {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 4px 0 10px;
  }
  .compare-table th, .compare-table td { text-align: right; }
  .compare-table th:first-child, .compare-table td:first-child { text-align: left; }
  .box-score { border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 20px; }
  .box-score-teams { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .box-score-logo { width: 26px; height: 26px; object-fit: contain; }
  .box-row {
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; padding: 5px 0;
    font-size: 13px; align-items: baseline;
  }
  .box-row + .box-row { border-top: 1px solid var(--border); }
  .box-value-home { text-align: left; font-variant-numeric: tabular-nums; font-weight: 600; }
  .box-value-away { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .box-label { text-align: center; color: var(--muted); white-space: nowrap; }
</style>
</head>
<body>

<h1>2026 Week 2 — Results</h1>
<p class="placeholder">Results for 2026 Week 2 aren&#x27;t in yet — check back after these games are final.</p>
<footer class="page-footer">Published 2026-09-10 10:49 CDT</footer>
</body>
</html>
